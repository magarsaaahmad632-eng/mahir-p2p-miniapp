<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHIR P2P</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        .logo {
            text-align: center;
            margin: 30px 0;
        }

        .logo h1 {
            margin-bottom: 5px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary {
            background: #168cff;
            color: white;
        }

        .secondary {
            background: #eee;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>🔐 MAHIR P2P</h1>
        <p>P2P Secure Exchange</p>
    </div>

    <div class="card">

        <h2>👤 Account Uumi</h2>

        <input
            type="text"
            placeholder="Email ykn Phone Number"
        >

        <input
            type="password"
            placeholder="Password"
        >

        <button class="primary">
            ➡️ Sign Up
        </button>

    </div>

</div>

</body>
</html>
