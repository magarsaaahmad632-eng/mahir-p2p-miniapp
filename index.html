<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAHIR P2P</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      text-align: center;
      padding: 30px 0 20px;
    }

    .logo h1 {
      margin: 0;
      font-size: 32px;
    }

    .logo p {
      color: #6b7280;
      margin-top: 8px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
      margin-bottom: 15px;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #168cff;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #168cff;
      color: white;
    }

    .secondary {
      background: #eef2f7;
      color: #111827;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }

    .home-header {
      text-align: center;
    }

    .home-header .icon {
      font-size: 50px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .menu-grid button {
      margin-top: 0;
      min-height: 90px;
    }

    .status {
      background: #f3f4f6;
      padding: 13px;
      border-radius: 12px;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .otp-input {
      text-align: center;
      font-size: 25px;
      letter-spacing: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <div class="logo">
    <h1>🔐 MAHIR P2P</h1>
    <p>P2P Secure Exchange</p>
  </div>


  <!-- =========================
       SIGN UP PAGE
  ========================== -->

  <div id="signupPage" class="card">

    <h2>👤 Account Uumi</h2>

    <p style="text-align:center;color:#6b7280;">
      Email kee fayyadamuun account uumi.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Email kee galchi"
      autocomplete="email"
    >

    <button
      id="sendOtpButton"
      class="primary"
      onclick="sendOTP()"
    >
      📩 OTP Ergi
    </button>

    <div id="signupMessage" class="message"></div>

  </div>


  <!-- =========================
       OTP PAGE
  ========================== -->

  <div id="otpPage" class="card hidden">

    <h2>🔐 OTP Mirkaneessi</h2>

    <p style="text-align:center;color:#6b7280;">
      Koodiin lakkoofsa 6 qabu email kee irratti ergameera.
    </p>

    <input
      id="otp"
      class="otp-input"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="000000"
      autocomplete="one-time-code"
    >

    <button
      id="verifyButton"
      class="primary"
      onclick="verifyOTP()"
    >
      ✅ Verify OTP
    </button>

    <button
      class="secondary"
      onclick="backToSignup()"
    >
      ↩️ Email Jijjiiri
    </button>

    <button
      class="secondary"
      onclick="resendOTP()"
    >
      🔄 OTP Irra Deebi'i
    </button>

    <div id="otpMessage" class="message"></div>

  </div>


  <!-- =========================
       HOME PAGE
  ========================== -->

  <div id="homePage" class="hidden">

    <div class="card home-header">

      <div class="icon">🎉</div>

      <h2>Baga Nagaan Dhuftan!</h2>

      <p id="userEmail"></p>

      <div class="status">
        🟢 Account: Verified
      </div>

    </div>


    <div class="card">

      <h2>🏠 MAHIR P2P</h2>

      <div class="menu-grid">

        <button
          class="primary"
          onclick="openFeature('🔄 P2P Exchange')"
        >
          🔄<br>
          P2P Exchange
        </button>

        <button
          class="secondary"
          onclick="openFeature('📢 My Ads')"
        >
          📢<br>
          My Ads
        </button>

        <button
          class="secondary"
          onclick="openFeature('📋 My Orders')"
        >
          📋<br>
          My Orders
        </button>

        <button
          class="secondary"
          onclick="openFeature('👤 Profile')"
        >
          👤<br>
          Profile
        </button>

        <button
          class="secondary"
          onclick="openFeature('🪪 KYC Verification')"
        >
          🪪<br>
          Verification
        </button>

        <button
          class="secondary"
          onclick="openFeature('💰 Balance')"
        >
          💰<br>
          Balance
        </button>

      </div>

      <div id="featureMessage" class="status hidden"></div>

      <button
        class="danger"
        onclick="logout()"
      >
        🚪 Logout
      </button>

    </div>

  </div>

</div>


<script>

  /* ==========================================
     SUPABASE CONFIGURATION
  ========================================== */

  const SUPABASE_URL =
    "https://immtkgxzwlqmnhanrbqy.supabase.co";

  const SUPABASE_KEY = 
    "sb_publishable_Pc0Hz90H_LFWTwbWPw7G4Q_0a8fLLIH";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     HELPERS
  ========================================== */

  function showMessage(id, text, type) {

    const element = document.getElementById(id);

    element.innerText = text;

    element.className =
      "message " + (type || "");

  }


  function showPage(pageId) {

    document
      .getElementById("signupPage")
      .classList.add("hidden");

    document
      .getElementById("otpPage")
      .classList.add("hidden");

    document
      .getElementById("homePage")
      .classList.add("hidden");

    document
      .getElementById(pageId)
      .classList.remove("hidden");
  }


  /* ==========================================
     SEND OTP
  ========================================== */

  async function sendOTP() {

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    if (!email) {

      showMessage(
        "signupMessage",
        "❌ Mee email kee galchi.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("sendOtpButton");

    button.disabled = true;

    button.innerText =
      "⏳ OTP ergaa jira...";


    showMessage(
      "signupMessage",
      "⏳ Mee xiqqoo eegi...",
      ""
    );


    try {

      const { error } =
        await supabaseClient.auth.signInWithOtp({

          email: email,

          options: {
            shouldCreateUser: true
          }

        });


      if (error) {

        console.error(error);

        showMessage(
          "signupMessage",
          "❌ " + error.message,
          "error"
        );

        button.disabled = false;

        button.innerText =
          "📩 OTP Ergi";

        return;
      }


      showMessage(
        "signupMessage",
        "✅ OTP email kee irratti ergameera.",
        "success"
      );


      showPage("otpPage");


      document
        .getElementById("otp")
        .focus();


    } catch (error) {

      console.error(error);

      showMessage(
        "signupMessage",
        "❌ Connection error. Internet kee ilaali.",
        "error"
      );

    }


    button.disabled = false;

    button.innerText =
      "📩 OTP Ergi";
  }


  /* ==========================================
     VERIFY OTP
  ========================================== */

  async function verifyOTP() {

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const otp =
      document
        .getElementById("otp")
        .value
        .trim();


    if (!otp) {

      showMessage(
        "otpMessage",
        "❌ Mee OTP galchi.",
        "error"
      );

      return;
    }


    if (!/^[0-9]{6}$/.test(otp)) {

      showMessage(
        "otpMessage",
        "❌ OTP lakkoofsa 6 qofa qabaachuu qaba.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("verifyButton");

    button.disabled = true;

    button.innerText =
      "⏳ Mirkaneessaa jira...";


    showMessage(
      "otpMessage",
      "⏳ OTP qoramaa jira...",
      ""
    );


    try {

      const { data, error } =
        await supabaseClient.auth.verifyOtp({

          email: email,

          token: otp,

          type: "email"

        });


      if (error) {

        console.error(error);

        showMessage(
          "otpMessage",
          "❌ OTP sirrii miti ykn yeroon isaa darbe.",
          "error"
        );

        button.disabled = false;

        button.innerText =
          "✅ Verify OTP";

        return;
      }


      if (!data || !data.session) {

        showMessage(
          "otpMessage",
          "❌ Verification milkaa'uu dadhabe. Irra deebi'i.",
          "error"
        );

        button.disabled = false;

        button.innerText =
          "✅ Verify OTP";

        return;
      }


      showMessage(
        "otpMessage",
        "✅ Account kee mirkanaa'eera!",
        "success"
      );


      document
        .getElementById("userEmail")
        .innerText =
        "📧 " + email;


      showPage("homePage");


    } catch (error) {

      console.error(error);

      showMessage(
        "otpMessage",
        "❌ Rakkoo connection uumame.",
        "error"
      );

    }


    button.disabled = false;

    button.innerText =
      "✅ Verify OTP";
  }


  /* ==========================================
     RESEND OTP
  ========================================== */

  async function resendOTP() {

    const email =
      document
        .getElementById("email")
        .value
        .trim();


    if (!email) {

      showMessage(
        "otpMessage",
        "❌ Email hin jiru.",
        "error"
      );

      return;
    }


    showMessage(
      "otpMessage",
      "⏳ OTP irra deebi'amee ergamaa jira...",
      ""
    );


    try {

      const { error } =
        await supabaseClient.auth.signInWithOtp({

          email: email,

          options: {
            shouldCreateUser: true
          }

        });


      if (error) {

        showMessage(
          "otpMessage",
          "❌ " + error.message,
          "error"
        );

        return;
      }


      showMessage(
        "otpMessage",
        "✅ OTP haaraan email kee irratti ergameera.",
        "success"
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "otpMessage",
        "❌ Connection error.",
        "error"
      );
    }
  }


  /* ==========================================
     BACK TO SIGNUP
  ========================================== */

  function backToSignup() {

    document
      .getElementById("otp")
      .value = "";

    document
      .getElementById("otpMessage")
      .innerText = "";

    showPage("signupPage");
  }


  /* ==========================================
     HOME FEATURES
  ========================================== */

  function openFeature(feature) {

    const message =
      document.getElementById("featureMessage");

    message.classList.remove("hidden");

    message.innerText =
      feature +
      " — feature kana KYC approval booda guutummaatti ni hojjenna.";
  }


  /* ==========================================
     LOGOUT
  ========================================== */

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("email")
      .value = "";

    document
      .getElementById("otp")
      .value = "";

    showPage("signupPage");

    showMessage(
      "signupMessage",
      "✅ Logout milkaa'e.",
      "success"
    );
  }


  /* ==========================================
     CHECK EXISTING SESSION
  ========================================== */

  async function checkSession() {

    try {

      const { data } =
        await supabaseClient.auth.getSession();


      if (
        data &&
        data.session &&
        data.session.user
      ) {

        const email =
          data.session.user.email || "";


        document
          .getElementById("userEmail")
          .innerText =
          "📧 " + email;


        showPage("homePage");
      }


    } catch (error) {

      console.error(
        "Session check error:",
        error
      );

    }
  }


  /* ==========================================
     START
  ========================================== */

  checkSession();

</script>

</body>
  </html>
